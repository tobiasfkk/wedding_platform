AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Wedding Platform - produção em uma EC2 (ADR 0008): Caddy, Spring Boot e PostgreSQL em Docker
  Compose. Sem NAT, balanceador, RDS ou SSH. Acesso administrativo pelo Session Manager e deploy
  pelo GitHub Actions via OIDC.

Parameters:
  AlertEmail:
    Type: String
    Description: E-mail para alertas de orçamento e para o Let's Encrypt.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  AdminEmail:
    Type: String
    Description: E-mail do administrador inicial do sistema (a senha é gerada no Parameter Store).
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
  MonthlyBudgetUsd:
    Type: Number
    Default: 35
    Description: Limite mensal (uso bruto, antes dos créditos) para os alertas do AWS Budgets.
  SiteDomain:
    Type: String
    Default: casamentodudatobi.tobiaskiefer.com.br
  ApiDomain:
    Type: String
    Default: api.casamentodudatobi.tobiaskiefer.com.br
  GitHubRepository:
    Type: String
    Default: tobiasfkk/wedding_platform
  GitRef:
    Type: String
    Default: main
    Description: Versão dos scripts usada na preparação inicial do host.
  GitHubOidcSubjectPrefix:
    Type: String
    # Formato imutável do GitHub (IDs do dono e do repositório), ativo neste repositório:
    #   gh api repos/<dono>/<repo>/actions/oidc/customization/sub  -> sub_claim_prefix
    Default: repo:tobiasfkk@78160146/wedding_platform@1316696942
    Description: Prefixo do claim "sub" do token OIDC do GitHub (sem ":environment:...").
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Use "false" se a conta já tiver o provedor token.actions.githubusercontent.com.

Conditions:
  CreateOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBackups
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BackupBucket.Arn
              - !Sub "${BackupBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: wedding-host
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Backups
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${BackupBucket.Arn}/*"
              - Sid: ListBackups
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
              - Sid: Secrets
                Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wedding/production/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Wedding Platform - somente HTTP (certificado/redirecionamento) e HTTPS
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      # Referência dinâmica: resolvida na criação e não reavaliada em atualizações que não mudem esta
      # linha. Um parâmetro do tipo SSM seria reavaliado a cada update e, com uma AMI nova, tentaria
      # substituir a instância (e o banco). Antes de qualquer update, revise o change set.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      DisableApiTermination: true
      # "standard": a t4g nunca gera cobrança extra de CPU acima da linha de base.
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: wedding-production }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          mkdir -p /opt/wedding
          chmod 700 /opt/wedding
          cat > /opt/wedding/host.conf <<'CONF'
          AWS_REGION=${AWS::Region}
          SSM_PREFIX=/wedding/production
          SITE_DOMAIN=${SiteDomain}
          API_DOMAIN=${ApiDomain}
          ACME_EMAIL=${AlertEmail}
          ADMIN_EMAIL=${AdminEmail}
          BACKUP_S3_URI=s3://${BackupBucket}/postgres
          GITHUB_REPOSITORY=${GitHubRepository}
          CONF
          curl -fsSL "https://raw.githubusercontent.com/${GitHubRepository}/${GitRef}/infrastructure/production/scripts/bootstrap-host.sh" -o /root/bootstrap-host.sh
          bash /root/bootstrap-host.sh "${GitRef}" > /var/log/wedding-bootstrap.log 2>&1

  PublicIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: wedding-production }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Usada só pelos workflows do environment "production" deste repositório.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # Ref ao provedor criado aqui garante a ordem de criação; senão, usa o já existente.
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "${GitHubOidcSubjectPrefix}:environment:production"
      Policies:
        - PolicyName: wedding-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunReleaseOnTheInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: ReadCommandResults
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"
              - Sid: ReadAdminCredentialsForSmokeTests
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/wedding/production/admin-password"

  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: wedding-platform-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        # Uso bruto: com créditos incluídos o custo líquido fica zerado e os alertas nunca disparam.
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Description: Crie no Cloudflare o registro A da API (sem proxy) apontando para este IP.
    Value: !Ref PublicIp
  BackupBucket:
    Value: !Ref BackupBucket
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  Region:
    Value: !Ref AWS::Region
