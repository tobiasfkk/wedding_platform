spring:
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:wedding}"
    username: "${POSTGRES_USER:wedding}"
    password: "${POSTGRES_PASSWORD:wedding_local}"
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

wedding:
  invitation-code:
    pepper: "${INVITATION_CODE_PEPPER:local-development-pepper-change-before-production-2026}"
    pepper-version: "${INVITATION_CODE_PEPPER_VERSION:1}"
    public-base-url: "${PUBLIC_SITE_URL:http://localhost:4200}"
