spring:
  datasource:
    url: "${DATABASE_URL}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"
    hikari:
      connection-timeout: "${DATABASE_CONNECTION_TIMEOUT_MS:5000}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

wedding:
  auth:
    allowed-origins: "${AUTH_ALLOWED_ORIGINS}"

server:
  servlet:
    session:
      cookie:
        secure: true
