spring:
  datasource:
    url: "${DATABASE_URL}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"
    hikari:
      connection-timeout: "${DATABASE_CONNECTION_TIMEOUT_MS:5000}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

wedding:
  auth:
    allowed-origins: "${AUTH_ALLOWED_ORIGINS}"
  invitation-code:
    pepper: "${INVITATION_CODE_PEPPER}"
    pepper-version: "${INVITATION_CODE_PEPPER_VERSION:1}"
    previous-pepper: "${INVITATION_CODE_PREVIOUS_PEPPER:}"
    previous-pepper-version: "${INVITATION_CODE_PREVIOUS_PEPPER_VERSION:}"
    public-base-url: "${PUBLIC_SITE_URL}"

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
