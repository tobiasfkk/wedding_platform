name: Deploy frontend preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Cloudflare Pages preview alias
        required: true
        default: manual-preview
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-preview
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_BRANCH: ${{ inputs.branch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check types and formatting
        run: npm run check

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build production frontend
        run: npm run build

      - name: Deploy Cloudflare Pages preview
        run: npm run deploy:pages -- --branch "$DEPLOY_BRANCH" --commit-hash "$GITHUB_SHA"

      - name: Write deployment summary
        if: always()
        working-directory: .
        run: echo "### Cloudflare Pages preview — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
