name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / build, tests and SpotBugs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build, test and analyze backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Write backend summary
        if: always()
        working-directory: .
        run: echo "### Backend — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend / build, tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24 and npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check types and formatting
        run: npm run check

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Install Chromium for mobile RSVP tests
        run: npx playwright install --with-deps chromium

      - name: Run mobile RSVP tests
        run: npm run e2e:mobile

      - name: Preserve mobile test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-rsvp-diagnostics
          path: |
            frontend/test-results/playwright
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production frontend
        run: npm run build

      - name: Write frontend summary
        if: always()
        working-directory: .
        run: echo "### Frontend — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
