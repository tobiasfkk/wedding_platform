name: Publish backend image

# Publica a imagem linux/arm64 (EC2 t4g/Graviton) no GHCR depois que a CI passa na main.
# Tags: SHA completo do commit (imutável, usada no deploy) e "main" (conveniência).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-backend-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push linux/arm64 image
    # Só publica commits cuja CI terminou com sucesso.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/wedding-backend

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testes e SpotBugs já rodaram na CI deste mesmo commit.
      - name: Package backend
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}

      - name: Write summary
        run: |
          echo "### Imagem publicada: \`$IMAGE:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
