<a class="skip-link" href="#main-content">Ir para o conteúdo principal</a>

@if (showAdministrativeChrome()) {
  <header class="app-header">
    <a class="brand" routerLink="/admin" aria-label="Administração do casamento — início">
      <span class="brand__mark" aria-hidden="true">∞</span>
      <span>Administração</span>
    </a>

    <nav aria-label="Navegação administrativa">
      <a routerLink="/admin/guests" routerLinkActive="is-active">Convidados</a>
      <a routerLink="/admin/invitations" routerLinkActive="is-active">Convites</a>
      <a routerLink="/admin/rsvp" routerLinkActive="is-active">Respostas</a>
      <a routerLink="/admin/pix" routerLinkActive="is-active">Pix</a>
    </nav>
  </header>
}

<main id="main-content" tabindex="-1" [class.main--public]="!showAdministrativeChrome()">
  <router-outlet />
</main>

@if (showAdministrativeChrome()) {
  <footer>
    <p>Wedding Platform</p>
  </footer>
}
